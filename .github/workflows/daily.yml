name: 每日选股

on:
  schedule:
    # GitHub 的 cron 用 UTC：07:40 UTC = 北京时间 15:40（收盘后 40 分钟）
    # 周一至周五。GitHub 有时会延迟几分钟到半小时才触发，不影响日线数据。
    - cron: '40 7 * * 1-5'
    # 多排几次：每次都是独立机器，当天已有快照就直接跳过（--if-missing）。
    # 东财对云机房 IP 偶尔限流几分钟，隔一小时再试基本都能成功。
    - cron: '20 8 * * 1-5'    # 北京 16:20
    - cron: '40 9 * * 1-5'    # 北京 17:40
    - cron: '10 12 * * 1-5'   # 北京 20:10
  workflow_dispatch:
    inputs:
      force:
        description: '强制重跑（即使当天已有快照）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 云机房 IP 更容易被东财限流，抓取并发降到 3
      SCREENER_LOW_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装依赖
        run: pip install -r requirements-ci.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 跑筛选并生成静态页面
        run: |
          set -o pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            python build_static.py --schedule 15:40 2>&1 | tee build.log
          else
            python build_static.py --if-missing --schedule 15:40 2>&1 | tee build.log
          fi

      - name: 记录失败原因
        if: failure()
        run: python tools/record_error.py

      - name: 清除旧的失败记录
        if: success()
        run: rm -f docs/data/last_error.json

      - name: 提交并推送
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "data: $(date -u +%F) 每日快照"
            git push
          fi
