name: 每日选股

on:
  schedule:
    # GitHub 的 cron 用 UTC：07:40 UTC = 北京时间 15:40（收盘后 40 分钟）
    # 周一至周五。GitHub 有时会延迟几分钟到半小时才触发，不影响日线数据。
    - cron: '40 7 * * 1-5'
    # 兜底：12:10 UTC = 北京时间 20:10 再跑一次。当天已有快照会直接跳过（--if-missing），
    # 所以只有 15:40 那次失败时才会真正补跑，等于自动重试。
    - cron: '10 12 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重跑（即使当天已有快照）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装依赖
        run: pip install -r requirements-ci.txt

      - name: 跑筛选并生成静态页面
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python build_static.py
          else
            python build_static.py --if-missing
          fi

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "data: $(date -u +%F) 每日快照"
            git push
          fi
