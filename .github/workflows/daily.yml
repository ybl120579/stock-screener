name: 每日选股

on:
  schedule:
    # GitHub 的 cron 用 UTC：03:00 UTC = 北京时间 11:00（上午收盘前最后一会儿）
    # 周一至周五。GitHub 有时会延迟几分钟到半小时才触发，不影响日线数据。
    - cron: '0 3 * * 1-5'
    # 多排几次：每次都是独立机器，当天已有快照就直接跳过（--if-missing）。
    # 东财对云机房 IP 偶尔限流几分钟，隔一小时再试基本都能成功。
    - cron: '20 3 * * 1-5'    # 北京 11:20（备跑）
    - cron: '40 3 * * 1-5'    # 北京 11:40（再备一次）
    - cron: '0 4 * * 1-5'     # 北京 12:00（最后兜底）
  workflow_dispatch:
    inputs:
      force:
        description: '强制重跑（即使当天已有快照）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 云机房 IP 更容易被东财限流，抓取并发降到 3
      SCREENER_LOW_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # 推之前要用 merge-base 判断远端有没有往前走，shallow clone 会判断错，所以拉全history（仓库只有几 MB）
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装依赖
        run: pip install -r requirements-ci.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 跑筛选并生成静态页面
        run: |
          set -o pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            python build_static.py --schedule 11:00 2>&1 | tee build.log
            python build_trend.py 2>&1 | tee -a build.log
          else
            python build_static.py --if-missing --schedule 11:00 2>&1 | tee build.log
            python build_trend.py --if-missing 2>&1 | tee -a build.log
          fi

      - name: 记录失败原因
        if: failure()
        run: python tools/record_error.py

      - name: 清除旧的失败记录
        if: success()
        run: rm -f docs/data/last_error.json

      - name: 提交并推送
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "data: $(date -u +%F) 每日快照"

          # 同一天可能有多次运行（4 个定时 + 手动触发）。谁先发布算谁的：
          # 后到的机器发现远端已经往前走了，就直接放弃推送（只留日志），
          # 不 rebase —— 因为 list.json / status.json 每次都会变，rebase 必然冲突。
          local_date=$(python -c "import json;print(json.load(open('docs/data/status.json')).get('trade_date',''))")
          git fetch --quiet origin main || true
          remote_date=$(git show origin/main:docs/data/status.json 2>/dev/null \
            | python -c "import sys,json;print(json.load(sys.stdin).get('trade_date',''))" 2>/dev/null \
            || echo "")

          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "远端已往前推进（另一次运行刚发布），本次跳过推送；本地 ${local_date} 名单未发布"
            exit 0
          fi
          if [ "$remote_date" = "$local_date" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "远端已有 ${local_date} 的快照，跳过推送"
            exit 0
          fi

          for i in 1 2 3; do
            if git push; then
              echo "推送成功：${local_date}"
              exit 0
            fi
            echo "第 $i 次推送失败，10 秒后重试"
            sleep 10
          done
          echo "::error::推送最终失败"
          exit 1
