<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="首板冷度">
<meta name="description" content="5/10 日内首板 → 回踩首板左侧 → 主板非 ST → 低热度散户少，每日自动更新的选股名单">
<title>首板回踩 · 低冷度选股</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap hrow">
    <div class="logo">冷</div>
    <div class="ttl">首板回踩 · 低冷度<small id="sub">加载中…</small></div>
    <button class="iconbtn" id="btnInfo" aria-label="说明" style="margin-left:6px">?</button>
    <button class="iconbtn" id="btnRefresh" aria-label="刷新">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="daysum" id="daysum"></div>
  <div class="renew" id="renew"></div>
  <div class="chips" id="dates"></div>
  <div class="tools">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5d6775"
        stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索 代码 / 名称 / 行业" autocomplete="off">
    </label>
  </div>
  <div class="chips" id="sorts"></div>
  <div class="ptr" id="ptr">正在重新筛选…</div>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</main>

<div class="sheet" id="sheet">
  <div class="mask"></div>
  <div class="panel">
    <div class="phead" id="phead"><div class="bar"></div></div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
