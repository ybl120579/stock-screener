<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>强趋势 · 高弹性选股</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap hrow">
    <div class="logo">趋</div>
    <div class="ttl">强趋势 · 高弹性<small id="sub">加载中…</small></div>
    <button class="iconbtn" id="btnInfo" title="说明">?</button>
  </div>
</header>

<div class="wrap">
  <nav class="stores">
    <a class="store" href="../">首板冷度</a>
    <a class="store on" href="./">强趋势</a>
  </nav>

  <section class="stats" id="stats"></section>
  <div class="daysum" id="daysum"></div>
  <div id="mkt"></div>
  <div class="renew" id="renew"></div>

  <div class="chips" id="dates"></div>

  <div class="search">
    <svg viewBox="0 0 24 24" width="15" height="15"><path d="M10 4a6 6 0 1 0 3.6 10.8l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z" fill="currentColor"/></svg>
    <input id="q" type="search" placeholder="搜索 代码 / 名称" autocomplete="off">
  </div>

  <div class="chips" id="sorts" style="margin-top:10px"></div>
  <div class="list" id="list"></div>
</div>

<div class="sheet" id="sheet">
  <div class="mask" data-close="1"></div>
  <div class="panel">
    <div class="phead" id="phead"></div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
